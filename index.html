<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>اختبار أصوات الحروف العربية</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Arabic","Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#111827}
main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 6px 24px #0001;margin-bottom:16px}
h1{font-size:28px;margin:0 0 8px}.muted{color:#667085}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button,.fileBtn{border:0;border-radius:16px;padding:15px 20px;font-weight:800;font-size:17px;cursor:pointer}
.primary{background:#111827;color:white}.secondary{background:#eef2f6;color:#111827}.danger{background:#fee4e2;color:#b42318}
input[type=file]{display:none}.students{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:15px}
.student{text-align:right;border:2px solid #e5e7eb;background:#fff}.student.selected{border-color:#111827}
.hidden{display:none!important}
.test{min-height:calc(100vh - 32px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.progress{width:min(700px,94%);height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#111827}
.target{font-size:clamp(130px,30vw,260px);font-weight:900;line-height:1.1;margin:24px 0;direction:rtl}
.timer{font-size:20px;color:#667085}.status{font-size:23px;font-weight:800;min-height:34px}.mic{margin-top:10px;font-size:18px}
.score{font-size:46px;font-weight:900}.errors{display:grid;gap:10px}.error{display:flex;justify-content:space-between;gap:12px;padding:14px;border-radius:15px;background:#fff1f0;border:1px solid #ffd1cc}
table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:right}
@media print{body{background:white}.noPrint{display:none!important}.card{box-shadow:none}.printArea{display:block!important}}
</style>
</head>
<body>
<main>
<section id="home" class="card">
<h1>اختبار إتقان أصوات الحروف العربية</h1>
<p class="muted">المستوى الأول: 28 حرفًا مع الفتحة. الطالب ينطق الصوت، ولا يذكر اسم الحرف.</p>
<div class="row">
<label class="fileBtn secondary">📋 استيراد كشف الأسماء
<input id="namesFile" type="file" accept=".txt,.csv">
</label>
<button id="demo" class="secondary">تجربة</button>
</div>
<p id="info" class="muted"></p>
<div id="students" class="students"></div>
<div class="row" style="margin-top:18px">
<button id="start" class="primary" disabled>▶️ بدء الاختبار</button>
<button id="printAll" class="secondary" disabled>🖨️ طباعة كشف جميع الطلاب</button>
</div>
</section>

<section id="test" class="card hidden test">
<div id="studentLabel"></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div id="target" class="target">بَ</div>
<div id="status" class="status">استعد...</div>
<div id="timer" class="timer">3.0</div>
<div id="mic" class="mic">🎙️ الميكروفون</div>
<button id="cancel" class="danger noPrint" style="margin-top:22px">إيقاف الاختبار</button>
</section>

<section id="result" class="card hidden printArea">
<h2 id="resultTitle"></h2>
<div id="score" class="score"></div>
<p id="percent"></p>
<h3>الأحرف التي لم يتقنها الطالب</h3>
<div id="errors" class="errors"></div>
<div class="row noPrint" style="margin-top:20px">
<button id="printStudent" class="primary">🖨️ طباعة نتيجة الطالب</button>
<button id="next" class="secondary">الطالب التالي</button>
<button id="homeBtn" class="secondary">العودة</button>
</div>
</section>

<section id="all" class="card hidden printArea">
<h2>كشف نتائج جميع الطلاب</h2>
<div id="allTable"></div>
<div class="row noPrint" style="margin-top:18px">
<button id="printAll2" class="primary">🖨️ طباعة الكشف</button>
<button id="back" class="secondary">عودة</button>
</div>
</section>
</main>

<script>
const letters=["ا","ب","ت","ث","ج","ح","خ","د","ذ","ر","ز","س","ش","ص","ض","ط","ظ","ع","غ","ف","ق","ك","ل","م","ن","ه","و","ي"];
const targets=letters.map(x=>x+"َ");
let names=[],sel=0,pos=0,order=[],results={},timer=null,recognizer=null,heard="",finished=false;
const $=x=>document.getElementById(x);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(){ $("students").innerHTML=names.map((n,i)=>`<button class="student ${i===sel?'selected':''}" onclick="sel=${i};render()">${i+1}. ${esc(n)}</button>`).join("");$("start").disabled=!names.length}
$("demo").onclick=()=>{names=["أحمد محمد","محمد علي","عبدالعزيز عادل","فهد خالد","ناصر إبراهيم","سلمان عبدالله"];sel=0;results={};$("info").textContent="تم تحميل أسماء تجريبية.";render()}
$("namesFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{names=r.result.split(/[\r\n,]+/).map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\d+[\s.)-]*/,""));sel=0;results={};$("info").textContent=`تم تحميل ${names.length} اسمًا.`;render()};r.readAsText(f,"UTF-8")}
$("start").onclick=()=>start(sel);
function start(i){sel=i;pos=0;order=shuffle(targets);results[names[i]]={items:[],score:0};$("home").classList.add("hidden");$("all").classList.add("hidden");$("result").classList.add("hidden");$("test").classList.remove("hidden");nextItem()}
function beginSpeech(target){
heard="";$("status").textContent="🎙️ انطق الصوت";$("mic").textContent="الميكروفون يستمع...";
if(!("webkitSpeechRecognition" in window)){ $("mic").textContent="⚠️ التعرف الصوتي غير متاح في Safari بهذه الطريقة";return}
try{
recognizer=new webkitSpeechRecognition();recognizer.lang="ar-SA";recognizer.continuous=false;recognizer.interimResults=false;recognizer.maxAlternatives=3;
recognizer.onresult=e=>{heard=e.results[0][0].transcript.trim();finish(compare(heard,target))};
recognizer.onerror=e=>{if(e.error!=="aborted")finish(false)};recognizer.start()
}catch(e){finish(false)}
}
function compare(spoken,target){
let a=(spoken||"").trim().replace(/[ًٌٍَُِّْـ]/g,"").replace(/[أإآ]/g,"ا");
let b=target.replace(/[ًٌٍَُِّْـ]/g,"").replace(/[أإآ]/g,"ا");
return a===b;
}
function nextItem(){
if(pos>=28){showResult();return}
let target=order[pos];$("target").textContent=target;$("studentLabel").textContent=`الطالب: ${esc(names[sel])} — ${pos+1} من 28`;$("bar").style.width=(pos/28*100)+"%";
$("status").textContent="استعد...";$("mic").textContent="🎙️ الميكروفون";let left=3;
clearInterval(timer);$("timer").textContent="3.0";
setTimeout(()=>beginSpeech(target),180);
timer=setInterval(()=>{left-=.1;$("timer").textContent=Math.max(0,left).toFixed(1);if(left<=0){clearInterval(timer);if(recognizer)try{recognizer.abort()}catch(e){}finish(false)}},100)
}
function finish(ok){
if(finished)return;finished=true;clearInterval(timer);if(recognizer)try{recognizer.stop()}catch(e){}recognizer=null;
let target=order[pos],r=results[names[sel]];r.items.push({target,heard,ok});if(ok)r.score++;
$("status").textContent=ok?"✓ صحيح":"✗ خطأ";$("mic").textContent=ok?"تم تسجيل الإجابة":"لم تُسجل إجابة صحيحة";
pos++;setTimeout(()=>{finished=false;nextItem()},450)
}
function showResult(){
$("test").classList.add("hidden");$("result").classList.remove("hidden");let r=results[names[sel]],bad=r.items.filter(x=>!x.ok);
$("resultTitle").textContent="نتيجة الطالب: "+names[sel];$("score").textContent=`${r.score} / 28`;$("percent").textContent=`نسبة الإتقان: ${Math.round(r.score/28*100)}%`;
$("errors").innerHTML=bad.length?bad.map(x=>`<div class="error"><b style="font-size:28px">${x.target}</b><span>${x.heard?`نطق الطالب: ${esc(x.heard)}`:"لم يُسجل صوت"} ❌</span></div>`).join(""):"<div class='error' style='background:#ecfdf3;border-color:#abefc6'><b>ممتاز 🎉</b><span>أتقن جميع الحروف.</span></div>";
$("printAll").disabled=false
}
function all(){ $("home").classList.add("hidden");$("result").classList.add("hidden");$("all").classList.remove("hidden");let rows=names.map((n,i)=>{let r=results[n];return `<tr><td>${i+1}</td><td>${esc(n)}</td><td>${r?r.score+" / 28":"—"}</td><td>${r?Math.round(r.score/28*100)+"%":"—"}</td><td>${r?(r.items.filter(x=>!x.ok).map(x=>x.target).join("، ")||"لا يوجد"):"لم يُختبر"}</td></tr>`}).join("");$("allTable").innerHTML=`<table><tr><th>م</th><th>اسم الطالب</th><th>النتيجة</th><th>الإتقان</th><th>الأحرف غير المتقنة</th></tr>${rows}</table>`}
$("printStudent").onclick=()=>window.print();$("printAll").onclick=all;$("printAll2").onclick=()=>window.print();$("back").onclick=()=>{$("all").classList.add("hidden");$("home").classList.remove("hidden")};$("homeBtn").onclick=()=>{$("result").classList.add("hidden");$("home").classList.remove("hidden");render()};$("next").onclick=()=>{if(sel+1<names.length)start(sel+1);else all()};$("cancel").onclick=()=>{clearInterval(timer);if(recognizer)try{recognizer.abort()}catch(e){};$("test").classList.add("hidden");$("home").classList.remove("hidden")};
render();
</script>
</body></html>
